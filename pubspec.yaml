name: antes_app
description: "ANTES — alerta sísmica temprana, guía de acción, zonas seguras y SOS comunitario para Colombia."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  geolocator: ^11.0.0
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.2
  http: ^1.2.1
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
